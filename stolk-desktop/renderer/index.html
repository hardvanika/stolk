    if (e.target.id === 'contactSearch') { state.contactQuery = e.target.value; document.getElementById('contactList').innerHTML = contactListHtml(); }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'addPerson' && e.target.value) {
      const p = state.projects.find((x) => x.id === Number(e.target.dataset.project));
      act(() => Api.put(`/projects/${p.id}/people/${e.target.value}`, { role: 'Colaborador' }), ['projects'], 'Persona añadida al proyecto');
    }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'waMode') { try { localStorage.setItem('stolk-wa', e.target.value); } catch {} render(); toast(e.target.value === 'web' ? 'WhatsApp se abrirá en el navegador' : 'WhatsApp se abrirá en la app'); } });
  document.addEventListener('change', (e) => { if (e.target.id === 'claudeModel') act(() => Api.patch('/settings', { claudeModel: e.target.value }), ['settings'], 'Modelo de Claude cambiado'); });
  document.addEventListener('change', (e) => { if (e.target.id === 'tPanel') act(async () => { const ext = await window.stolk.setPanel(e.target.checked); if (ext === 'relogin') toast('Cierra sesión y vuelve a entrar una vez para activar el panel'); }, ['shell']); });
  document.addEventListener('change', (e) => { if (e.target.id === 'tBlock') act(() => Api.patch('/settings', { blockEvents: e.target.checked }), ['settings'], e.target.checked ? 'Tus eventos bloquearán Cal.com' : 'Tus eventos ya no bloquean Cal.com'); });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'askForm') return;
    e.preventDefault();
    const q = document.getElementById('askInput').value.trim();
    if (state.askLoading) return;
    if (q || state.askFiles.length) claudeAsk(q || 'Mira lo que te adjunto.');
  });

  // While Ivan types in Preguntar the ö looks down at the box and nods with each key.
  document.addEventListener('input', (e) => { if (e.target.id !== 'askInput' || state.askLoading) return; stolkO.set(e.target.value.trim() ? 'listen' : 'idle'); stolkO.ping(); });
  document.addEventListener('focusout', (e) => { if (e.target.id === 'askInput' && stolkO.state === 'listen') stolkO.set('idle'); });
  document.addEventListener('click', (e) => { const x = e.target.closest('[data-remove-file]'); if (x) { state.askFiles.splice(Number(x.dataset.removeFile), 1); renderComposerFiles(); } });
  window.stolk?.onCapture?.((r) => onCapture(r));
  // Auto-update (AppImage only): main downloads the new version; Ivan decides when to restart.
  function showUpdate(version) {
    if (document.getElementById('updateBar')) return;
    const bar = document.createElement('div');
    bar.id = 'updateBar'; bar.className = 'update-bar'; bar.setAttribute('role', 'status');
    bar.innerHTML = `<span>Nueva versión disponible${version ? ` (${esc(version)})` : ''}</span><button class="btn primary small" type="button">Reiniciar</button><button class="btn ghost small" type="button" aria-label="Más tarde">Más tarde</button>`;
    const [restart, later] = bar.querySelectorAll('button');
    restart.addEventListener('click', () => window.stolk.installUpdate());
    later.addEventListener('click', () => bar.remove());
    document.body.appendChild(bar);
  }
  window.stolk?.onUpdateReady?.(showUpdate);
  window.stolk?.updateStatus?.().then((u) => { state.update = u; if (u?.ready) showUpdate(u.ready); }).catch(() => {});
  async function start() {
    try { await load(); state.ready = true; render(); startSync(); }
    catch (err) { main.innerHTML = `<div class="empty" style="text-align:left"><h1>Stölk no encuentra su servidor local</h1><p class="sub">${esc(err.message)}</p></div>`; }
  }
  let syncTimer = null;
  const startSync = () => { if (syncTimer) return; syncNow(false); syncTimer = setInterval(() => syncNow(false), 15 * 60 * 1000); };
  // Coming back from Claude or the Google sign-in: pick up what changed meanwhile (Claude can write through MCP).
  window.addEventListener('focus', () => {
    if (!state.ready) return;
    const typing = document.activeElement?.matches?.('input, textarea, select');
    const modalOpen = !!modalRoot.firstChild;
    load('connections', 'contacts', 'interactions', 'projects', 'claudeMcp').then(() => { if (!typing && !modalOpen) render(); }).catch(() => {});
  });
  if (await Api.ready()) start();
  else {
    main.innerHTML = '<p class="muted">Arrancando…</p>';
    // Don't rely only on the push: poll too, and say so if the local server never comes up.
    let started = false, waited = 0;
    const go = () => { if (started) return; started = true; clearInterval(poll); start(); };
    window.stolk?.onApiReady?.(go);
    const poll = setInterval(async () => {
      if (await Api.ready()) return go();
      if (++waited === 20) main.innerHTML = '<p class="muted">El servidor local de Stölk no arranca. Cierra Stölk desde el icono de la barra (Salir) y vuelve a abrirlo.</p>';
    }, 1000);
  }
})();
</script>
</body>
</html>
