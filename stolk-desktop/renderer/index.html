<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'">
<title>Stölk</title>
<link rel="stylesheet" href="fonts/fonts.css">
</head>
<body>
<style>
/* Monochrome, Cal.com-like: near-black canvas, thin borders, white primary button. Light theme mirrors it. */
:root {
  --bg: #F7F7F7; --surface: #FFFFFF; --surface-2: #F1F1F1; --surface-3: #E7E7E7;
  --ink: #111111; --muted: #6B6B6B; --line: #E4E4E4; --line-strong: #CFCFCF;
  --accent: #111111; --on-accent: #FFFFFF;
  --events: #111111; --people: #6B6B6B; --tag-ink: #FFFFFF;
  --rail: #F7F7F7; --rail-ink: #111111; --rail-muted: #6B6B6B; --rail-hover: #ECECEC;
  --warn: #111111;
  --overlay: rgba(0, 0, 0, .4);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.08);
  --font-display: "Quicksand", "Inter", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "Inter", system-ui, sans-serif;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101010; --surface: #161616; --surface-2: #1E1E1E; --surface-3: #2A2A2A;
    --ink: #EDEDED; --muted: #8C8C8C; --line: #262626; --line-strong: #3A3A3A;
    --accent: #FFFFFF; --on-accent: #101010;
    --events: #EDEDED; --people: #8C8C8C; --tag-ink: #101010;
    --rail: #101010; --rail-ink: #EDEDED; --rail-muted: #8C8C8C; --rail-hover: #1E1E1E;
    --warn: #EDEDED;
    --overlay: rgba(0, 0, 0, .65); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101010; --surface: #161616; --surface-2: #1E1E1E; --surface-3: #2A2A2A;
  --ink: #EDEDED; --muted: #8C8C8C; --line: #262626; --line-strong: #3A3A3A;
  --accent: #FFFFFF; --on-accent: #101010;
  --events: #EDEDED; --people: #8C8C8C; --tag-ink: #101010;
  --rail: #101010; --rail-ink: #EDEDED; --rail-muted: #8C8C8C; --rail-hover: #1E1E1E;
  --warn: #EDEDED;
  --overlay: rgba(0, 0, 0, .65); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
main:focus, main:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:root { --topbar: 64px; }
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar); display: flex; align-items: center; justify-content: center; background: var(--rail); border-bottom: 1px solid var(--line); }
.topbar .logo { width: 92px; display: block; overflow: visible; color: var(--rail-ink); --m-bg: var(--rail); }
.topbar .logo .stroke { stroke: var(--rail-ink); }
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); border-right: 1px solid var(--line); padding-block: 22px; padding-inline: 12px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: var(--topbar); height: calc(100vh - var(--topbar)); }
.rail .logo { width: 84px; margin-left: 10px; display: block; }
.rail .logo .stroke { stroke: var(--rail-ink); }
.rail .logo .eye { fill: var(--rail-ink); }
.rail .logo .glint { fill: var(--rail); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--rail-muted); text-decoration: none; font-weight: 500; transition: background .12s, color .12s; }
.nav a:hover { background: var(--rail-hover); color: var(--rail-ink); }
.nav a[aria-current="page"] { background: var(--rail-hover); color: var(--rail-ink); }
.nav .dot { display: none; }
.ev-link { display: inline-block; margin-top: 4px; font-size: 13px; color: var(--ink); text-underline-offset: 3px; overflow-wrap: anywhere; }
.nav-sep { display: block; height: 1px; background: var(--line); margin: 10px 10px; }
.logo .m-look { transition: transform .15s ease-out; }
.nav .ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--rail-muted); font-variant-numeric: tabular-nums; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.rail-foot .me { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 13px; color: var(--rail-muted); }
.rail-foot .me .avatar { width: 26px; height: 26px; font-size: 11px; }
.seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--line-strong); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 5px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.settings-sec { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px 32px; padding-block: 26px; border-top: 1px solid var(--line); max-width: 980px; }
.settings-sec:first-of-type { border-top: 0; padding-top: 4px; }
.settings-sec > header p { margin: 4px 0 0; }
.settings-sec .stack { gap: 16px; }
.status-line { display: flex; align-items: center; gap: 8px; }
.led { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); flex: none; }
.led.off { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); }

main { min-width: 0; max-width: 1180px; padding-block: 36px 72px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
.view-head:not(:has(button, a.btn)) { display: none; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 28px; }
h1 { font: 700 24px/1.2 var(--font-display); margin: 0; letter-spacing: 0; text-wrap: balance; }
h2 { font: 700 18px/1.25 var(--font-display); margin: 0; text-wrap: balance; }
h3 { font: 600 14.5px/1.3 var(--font-ui); margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; }
.eyebrow { font: 500 13px var(--font-ui); color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; font-size: 13px; }
.muted { color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); border-radius: 8px; padding: 7px 14px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent); opacity: .88; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-pad { padding: 20px 22px; }
.grid-today { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 22px 10px; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 22px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.clickable { cursor: pointer; transition: background .12s; }
.row.clickable:hover { background: var(--surface-2); }
.row .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font-ui); background: var(--surface-3); color: var(--ink); flex: none; }
.avatar.lg { width: 56px; height: 56px; font-size: 18px; }
.datebox { width: 44px; text-align: center; border-radius: 8px; border: 1px solid var(--line); padding: 5px 0 6px; flex: none; }
.datebox .d { font: 600 17px/1 var(--font-display); }
.datebox .m { font: 500 11px var(--font-ui); color: var(--muted); }

.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 1px 8px; font: 500 12px/1.6 var(--font-ui); color: var(--ink); background: var(--surface-3); white-space: nowrap; }
.tag.event { background: var(--ink); color: var(--bg); }
.tag.plain { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
.tag.cal { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.tag.cal::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.tag.warn { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

.kpis { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: -12px 0 24px; color: var(--muted); }
.kpi { padding: 0; background: none; border: 0; display: flex; align-items: baseline; gap: 7px; }
.kpi .n { font: 600 15px var(--font-ui); color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13.5px; margin: 0; }

.split { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.search { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); }
.search:focus { outline: none; border-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.contact-list .row { grid-template-columns: auto minmax(0, 1fr) auto; padding: 10px 14px; }
.contact-list .row[aria-selected="true"] { background: var(--surface-2); }
.since { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.since.stale { color: var(--ink); font-weight: 600; }
.detail-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.detail-head .who { min-width: 0; flex: 1; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 20px; margin: 18px 0 4px; }
.fact .k { font-size: 12px; color: var(--muted); font-weight: 500; }
.fact .v { overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 4px; }
.timeline li { position: relative; padding: 0 0 18px 24px; }
.timeline li::before { content: ""; position: absolute; left: 4px; top: 16px; bottom: 0; width: 1px; background: var(--line-strong); }
.timeline li.opened { padding-bottom: 12px; }
.timeline li.opened .node { width: 7px; height: 7px; left: 1px; top: 6px; }
.timeline li:last-child::before { display: none; }
.timeline .node { position: absolute; left: 0; top: 5px; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--surface); }
.timeline .node.cal, .timeline .node.event { border-color: var(--ink); background: var(--ink); }
.timeline .when { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.timeline .what { margin-top: 2px; }
.followup { display: inline-flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--muted); }
.back { display: none; }

.event-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.event-card { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.event-card .top { display: flex; gap: 14px; align-items: flex-start; }
.guest-row { display: flex; align-items: center; gap: 4px; }
.guest-row .avatar { width: 26px; height: 26px; font-size: 10.5px; border: 2px solid var(--surface); margin-left: -6px; }
.guest-row .avatar:first-child { margin-left: 0; }
.spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 2px solid var(--line); border-top-color: currentColor; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.update-bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; max-width: calc(100vw - 32px); }
.google-btn { gap: 10px; background: #fff; color: #1f1f1f; border: 1px solid #747775; font-weight: 500; }
.google-btn:hover { background: #f2f2f2; }
details > summary { cursor: pointer; }
.chat { display: flex; flex-direction: column; height: calc(100vh - 96px); min-height: 420px; max-width: 820px; margin: 0 auto; }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 8px 2px 16px; }
.chat-empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
.msg { display: flex; }
.msg.me { justify-content: flex-end; }
.msg .bubble { max-width: 85%; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); line-height: 1.55; font-size: 15px; }
.msg .answer, .msg .msg-text { white-space: pre-wrap; }
.msg.me .bubble { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.msg .bubble.err { border-color: var(--line-strong); }
.msg .answer { font-size: 15px; }
.msg .cites { margin-top: 10px; }
.msg .cites .tag { cursor: pointer; font: inherit; font-size: 12.5px; }
.draft-box { margin-top: 12px; white-space: normal; }
.draft-box textarea { min-height: 130px; }
.draft-old { margin-top: 10px; padding: 10px 12px; border-left: 2px solid var(--line-strong); color: var(--muted); }
.msg-files, .composer-files { display: flex; flex-wrap: wrap; gap: 6px; }
.msg-files { margin-bottom: 8px; }
.composer-files:empty { display: none; }
.composer { border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.composer:focus-within { border-color: var(--ink); }
.composer-row { display: flex; align-items: flex-end; gap: 8px; }
.composer textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; font: inherit; font-size: 15px; line-height: 1.5; padding: 7px 4px; max-height: 200px; color: var(--ink); }
.composer textarea:focus { outline: none; }
.icon-btn { width: 36px; height: 36px; flex: none; border-radius: 8px; border: 0; background: transparent; color: var(--ink); font-size: 26px; font-weight: 300; line-height: 1; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.picker { position: relative; display: flex; flex-direction: column; gap: 8px; }
.picker-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.picker-chips:empty { display: none; }
.pick-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--ink); }
.pick-chip .avatar { width: 22px; height: 22px; font-size: 10px; }
.pick-chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 5px; border-radius: 999px; }
.pick-chip button:hover { color: var(--ink); }
.picker-list { margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-height: 196px; overflow-y: auto; z-index: 5; }
.picker-list[hidden] { display: none; }
.picker-list li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.picker-list li .muted { font-size: 12.5px; }
.picker-list li[aria-selected="true"], .picker-list li:hover { background: var(--surface-2); }
.picker-list .none { color: var(--muted); cursor: default; }
.me-login { width: 100%; text-align: left; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; font: 500 13.5px var(--font-ui); color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.me-login:hover { background: var(--surface-2); }
.me-sub { display: block; font-size: 12px; color: var(--muted); }
.file-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); font-size: 13px; }
.file-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
.file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-x { border: 0; background: transparent; cursor: pointer; font-size: 16px; color: var(--muted); padding: 0 2px; }
.cal-sync { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

.cal-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.ev { background: var(--ink); }
.sw.bk { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-strong); }
.sw.bl { background: repeating-linear-gradient(-45deg, var(--muted) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--line-strong); }
.sw.fu { border: 1px dashed var(--muted); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.month .dow { font: 500 12px var(--font-ui); color: var(--muted); padding: 8px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.month .day { min-height: 108px; padding: 6px 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.month .dow:nth-child(7n), .month .day:nth-child(7n) { border-right: 0; }
.month .day { cursor: pointer; }
.month .day:hover { background: var(--surface-2); }
.month .day:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.month .day.out { background: var(--bg); }
.day-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.day-list li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.day-list li:first-child { border-top: 0; }
.day-list .t { font-variant-numeric: tabular-nums; font-weight: 600; }
.day-list .t span { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.day-list .what { min-width: 0; }
.day-list .what .title { font-weight: 600; overflow-wrap: anywhere; }
.day-list .what .meta { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.month .day.out .num { color: var(--muted); opacity: .6; }
.month .num { font: 500 12.5px var(--font-ui); padding: 1px 6px; align-self: flex-start; border-radius: 6px; font-variant-numeric: tabular-nums; }
.month .today .num { background: var(--ink); color: var(--bg); }
.item { display: block; width: 100%; text-align: left; border: 0; border-radius: 5px; padding: 3px 6px; font-size: 12px; line-height: 1.3; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); background: var(--surface-3); }
.item.event { background: var(--ink); color: var(--bg); }
.item.cal { background: var(--surface-3); }
.item.block { background: repeating-linear-gradient(-45deg, var(--surface-3) 0 5px, var(--surface-2) 5px 10px); color: var(--muted); }
.item.follow { background: transparent; color: var(--muted); border: 1px dashed var(--line-strong); }
.agenda { display: none; }

.ask-box { display: flex; gap: 10px; }

(function(){const modes=['claro','oscuro','sistema'];let i=0;try{i=Math.max(0,modes.indexOf(localStorage.getItem('stolk-theme2')||'claro'))}catch(e){}
function apply(){const m=modes[i];if(m==='sistema')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m==='oscuro'?'dark':'light');const b=document.getElementById('themeBtn');if(b)b.textContent='Tema: '+m;try{localStorage.setItem('stolk-theme2',m)}catch(e){}}
window.stolkTheme={get:()=>modes[i],set:(m)=>{i=Math.max(0,modes.indexOf(m));apply();}};apply();})();
/* The ö mascot: eyes follow the cursor and blink; it hops, thinks and reacts in Preguntar; sleeps after 3 minutes idle. */
window.stolkO = (() => {
  const g = document.getElementById('logoO');
  if (!window.StolkMascot || !g) return { set() {}, play: async () => {}, ping() {}, state: 'idle' };
  const o = StolkMascot.mount(g, { drop: 80 });
  let idleT = 0;
  const wake = () => { if (o.state === 'sleep') o.set('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (o.state === 'idle') o.set('sleep'); }, 180000); };
  ['pointermove', 'keydown', 'pointerdown', 'focus'].forEach((t) => window.addEventListener(t, wake, { passive: true }));
  wake();
  return o;
})();

(async () => {
  const TODAY = new Date();
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const daysBetween = (a, b) => Math.round((b - a) / 86400000);
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const MON = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const DOW = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
  const fmt = (s) => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
  const fmtLong = (s) => { const d = parse(s); return `${DOW[(d.getDay() + 6) % 7]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  const CHANNELS = { reunion: 'Reunión', llamada: 'Llamada', email: 'Email', mensaje: 'Mensaje', evento: 'Evento', cal: 'Cal.com' };
  const CAL_TYPES = [
    { id: 'cafe', name: 'Café', min: 30, slug: 'cafe-30' },
    { id: 'llamada', name: 'Llamada', min: 15, slug: 'llamada-15' },
    { id: 'reunion', name: 'Reunión', min: 45, slug: 'reunion-45' },
  ];

  const state = {
    calConnected: false,
    gcalConnected: false,
    gmailConnected: false,
    conn: {},
    lastSync: null,
    syncing: false,
    claudeModel: 'claude-opus-5-5',
    blockEvents: true,
    contacts: [], events: [], interactions: [], bookings: [], gcal: [], relations: [], projects: [], today: [],
    claudeOn: false,
    enrichOn: false, enrich: {}, enriching: null,
    shell: { shortcut: 'Ctrl+Shift+S', panel: false, hasKey: false, shortcutActive: false, wayland: false },
    capture: null,
    selectedProject: null,
    selectedContact: null,
    contactFilter: 'todos',

  // ---------- Data from the local server (see plan/stolk-api-interface.md) ----------
  const nowHM = () => TODAY.toTimeString().slice(0, 5);
  async function load(...keys) {
    const want = (k) => !keys.length || keys.includes(k);
    const jobs = [];
    if (want('contacts')) jobs.push(Api.get('/contacts').then((v) => { state.contacts = v; }));
    if (want('interactions')) jobs.push(Api.get('/interactions').then((v) => { state.interactions = v; }));
    if (want('relations')) jobs.push(Api.get('/relations').then((v) => { state.relations = v; }));
    if (want('events')) jobs.push(Api.get('/events').then((v) => { state.events = v; }));
    if (want('projects')) jobs.push(Api.get('/projects').then((v) => { state.projects = v; }));
    if (want('today')) jobs.push(Api.get('/today').then((v) => { state.today = v; }));
    if (want('calendar')) {
      const m = state.calMonth;
      const from = iso(addDays(new Date(m.getFullYear(), m.getMonth(), 1), -7)), to = iso(addDays(new Date(m.getFullYear(), m.getMonth() + 1, 0), 14));

    }

    if (want('connections')) jobs.push(Api.get('/connections').then((v) => { state.conn = v; state.calConnected = !!v.calcom?.connected; state.gcalConnected = !!v.gcal?.connected; state.gmailConnected = !!v.gmail?.connected; state.lastSync = [v.calcom?.lastSync, v.gcal?.lastSync, v.gmail?.lastSync].filter(Boolean).sort().pop() || null; state.claudeConnected = !!v.claude?.connected; }));
    if (want('claudeMcp')) jobs.push(Api.get('/integrations/claude').then((v) => { state.claudeMcp = v; }, () => { state.claudeMcp = null; }));
    if (want('shell') && window.stolk?.settings) jobs.push(window.stolk.settings().then((v) => { state.shell = v; }));
    await Promise.all(jobs);
  }
  // Runs an action against the server, reloads what it touched, re-renders, and reports errors as a toast.
  async function act(fn, reload = [], okMsg) {
    try { await fn(); if (reload.length) await load(...reload); render(); if (okMsg) { toast(okMsg); stolkO.play('celebrate'); } return true; }
    catch (err) { toast(err.message || 'Algo ha fallado'); stolkO.play('error'); return false; }

  async function syncNow(manual) {

    try {

  const daysSince = (cid) => { const l = lastContact(cid); return l ? daysBetween(parse(l), TODAY) : null; };
  const STALE = 60;

  // ---------- Router ----------
  const ICONS = {"hoy": "<path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/>", "contactos": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5\"/><path d=\"M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.5 3.5 5.2\"/>", "proyectos": "<path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/>", "eventos": "<path d=\"M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z\"/>", "calendario": "<rect x=\"3\" y=\"4.5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 9.5h18M8 2.5v4M16 2.5v4\"/>", "preguntar": "<path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12z\"/>", "borradores": "<path d=\"M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z\"/><path d=\"M13.5 6.5l4 4\"/>", "integraciones": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/>"};
  const VIEWS = [
    { id: 'preguntar', label: 'Preguntar' },
    { id: 'hoy', label: 'Hoy', count: () => todayItems().length },
    { id: 'calendario', label: 'Calendario' },
    { id: 'contactos', label: 'Personas', count: () => state.contacts.length },

    { id: 'eventos', label: 'Eventos', more: true },
    { id: 'integraciones', label: 'Ajustes', foot: true },
  ];
  const current = () => { const h = location.hash.replace('#', ''); return VIEWS.some((v) => v.id === h) ? h : 'preguntar'; };
  const main = document.getElementById('main');

  function renderNav() {
    const cur = current();

    return todayItems().length
      + state.projects.reduce((n, p) => n + p.tasks.filter((x) => x.st === 'pendiente' && x.due && x.due <= t).length, 0)
      + state.interactions.filter((i) => i.follow === t).length;
  };
  let lastBadge = null;
  function syncBadge() { const n = badgeCount(); if (n !== lastBadge && window.stolk?.setBadge) { lastBadge = n; window.stolk.setBadge(n).catch(() => {}); } }
  function render() {
    if (!state.ready) return;
    renderNav();
    syncBadge();
    const v = current();
    main.classList.toggle('fit', v === 'calendario' || v === 'preguntar');
    main.innerHTML = ({ hoy: viewToday, contactos: viewContacts, proyectos: viewProjects, eventos: viewEvents, calendario: viewCalendar, preguntar: viewAsk, integraciones: viewCal })[v]();
    if (v === 'preguntar') document.getElementById('askInput')?.focus({ preventScroll: true });
    if (v === 'preguntar') {
      const input = document.getElementById('askInput');
      const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; };
      input?.addEventListener('input', grow);
      input?.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById('askForm').requestSubmit(); } });
      input?.addEventListener('paste', (e) => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); addAskFiles(fs); } });
      const log = document.getElementById('chatLog'); if (log) log.scrollTop = log.scrollHeight;
      document.getElementById('askAttach')?.addEventListener('click', () => document.getElementById('askFileInput').click());
      document.getElementById('askFileInput')?.addEventListener('change', (e) => { addAskFiles([...e.target.files]); e.target.value = ''; });
      const form = document.getElementById('askForm');
      form?.addEventListener('dragover', (e) => e.preventDefault());
      form?.addEventListener('drop', (e) => { e.preventDefault(); addAskFiles([...(e.dataTransfer?.files || [])]); });
    }
  }
  window.addEventListener('hashchange', () => { render(); main.focus({ preventScroll: true }); window.scrollTo(0, 0); main.scrollTop = 0; });

  const protoFlag = '';
  const tagHtml = (t) => `<span class="tag">${esc(t)}</span>`;
  const chLabel = (i) => i.ch === 'cal' ? `<span class="tag cal">Cal.com · ${esc(i.calType || '')}</span>` : `<span class="tag plain">${CHANNELS[i.ch]}</span>`;

  // ---------- Hoy ----------
  const bookingName = (b) => byId(b.cid)?.name || b.attendeeName || b.attendeeEmail || 'invitado';
  function upcomingItems(days) {
    const end = iso(addDays(TODAY, days));
    const t = iso(TODAY);
    const ev = state.events.filter((e) => e.date >= t && e.date <= end).map((e) => ({ kind: 'event', date: e.date, time: e.start, title: e.title, sub: `${e.place} · ${e.guests.length} invitados`, ref: e.id }));
    const bk = state.bookings.filter((b) => b.date >= t && b.date <= end).map((b) => ({ kind: 'cal', date: b.date, time: b.start, title: `${b.type} con ${bookingName(b)}`, sub: `Cal.com · ${b.start}–${b.end}`, ref: b.cid }));
    return [...ev, ...bk].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  }
  const todayItems = () => state.today.map((it) => ({ ...it, action: it.src === 'event' ? 'open-event' : it.cid ? 'open-contact' : null, id: it.src === 'event' ? it.id : it.cid, c: it.cid ? byId(it.cid) : null }));
  const SRC = { event: '<span class="tag event">Mi evento</span>', cal: '<span class="tag cal">Cal.com</span>', gcal: '<span class="tag plain">Google</span>' };
  function viewToday() {
    const items = todayItems();
    const now = nowHM();
    return `
      <div class="view-head">
        <div><h1 class="sr-only">Hoy</h1></div>
      </div>
      <ul class="list panel today-list">${items.map((it) => `
        <li class="row today-row ${it.end <= now ? 'past' : ''}">
          <div class="hour"><div>${it.start}</div><div class="muted">${it.end}</div></div>
          <div style="min-width:0" ${it.action ? `class="clickable-area" data-action="${it.action}" data-id="${it.id}"` : ''}><div class="title">${esc(it.title)}</div>${it.sub ? `<div class="meta">${esc(it.sub)}</div>` : ''}</div>
          <div class="today-side">${SRC[it.src]}${it.c ? chatButtons(it.c, true) : ''}</div>
        </li>`).join('') || '<li class="empty">Hoy no tienes reuniones.</li>'}</ul>`;
  }

  // ---------- Contactos ----------
  function filteredContacts() {
    const q = fold(state.contactQuery.trim());
    return state.contacts.filter((c) => {
      if (state.contactFilter === 'seguimiento' && !state.interactions.some((i) => i.cid === c.id && i.follow)) return false;
      if (state.contactFilter === 'sin-contacto' && !((daysSince(c.id) ?? 0) >= STALE)) return false;
      if (state.contactFilter !== 'todos' && !['seguimiento', 'sin-contacto'].includes(state.contactFilter) && !c.tags.includes(state.contactFilter)) return false;
      if (!q) return true;
      return fold([c.name, c.company, c.role, c.tags.join(' '), c.notes].join(' ')).includes(q);
    }).sort((a, b) => (lastContact(b.id) || '').localeCompare(lastContact(a.id) || ''));
  }
  function contactListHtml() {
    const list = filteredContacts();
    return list.map((c) => { const d = daysSince(c.id); return `
      <li class="row clickable" data-action="select-contact" data-id="${c.id}" aria-selected="${c.id === state.selectedContact}">
        <div class="avatar">${initials(c.name)}</div>
        <div style="min-width:0"><div class="title">${esc(c.name)}</div><div class="meta">${esc(c.role)} · ${esc(c.company)}</div></div>
        <span class="since ${d >= STALE ? 'stale' : ''}">${d === null ? '—' : d === 0 ? 'hoy' : d + ' d'}</span>
      </li>`; }).join('') || '<li class="empty">Nadie coincide con esa búsqueda.</li>';
  }
  function viewContacts() {
    const allTags = [...new Set(state.contacts.flatMap((c) => c.tags))];
    const chips = [['todos', 'Todos'], ['seguimiento', 'Con seguimiento'], ['sin-contacto', `+${STALE} días sin hablar`], ...allTags.map((t) => [t, t])];
    const c = byId(state.selectedContact);
    return `
      <div class="view-head">
        <div><h1 class="sr-only">Personas</h1></div>
        <div class="actions">${protoFlag}<button class="btn primary" data-action="new-contact">Nuevo contacto</button></div>
      </div>
      <div class="split ${state.mobileDetail ? 'has-detail' : ''}">
        <div class="list-col">
          <input class="search" id="contactSearch" type="search" placeholder="Buscar por nombre, empresa, etiqueta o nota" value="${esc(state.contactQuery)}" aria-label="Buscar contactos">
          <div class="filters">${chips.map(([k, l]) => `<button class="chip" data-action="filter" data-id="${esc(k)}" aria-pressed="${state.contactFilter === k}">${esc(l)}</button>`).join('')}</div>
          <ul class="list panel contact-list" id="contactList">${contactListHtml()}</ul>
        </div>
        <div class="detail-col">${c ? contactDetail(c) : '<div class="panel empty">Elige un contacto.</div>'}</div>
      </div>`;
  }
  function contactDetail(c) {
    const hist = state.interactions.filter((i) => i.cid === c.id).sort((a, b) => b.date.localeCompare(a.date));
    const futureBk = state.bookings.filter((b) => b.cid === c.id && b.date >= iso(TODAY)).sort((a, b) => a.date.localeCompare(b.date));
    const evs = state.events.filter((e) => e.guests.some((g) => g.cid === c.id));
    const d = daysSince(c.id);
    return `
      <section class="panel panel-pad">
        <button class="btn ghost small back" data-action="back-list">← Personas</button>
        <div class="detail-head">
          <div class="avatar lg">${initials(c.name)}</div>
          <div class="who"><h2 style="font-size:24px">${esc(c.name)}</h2><div class="muted">${esc(c.role)} · ${esc(c.company)}</div></div>
          <div class="actions">
            <button class="btn" data-action="edit-contact" data-id="${c.id}">Editar</button>
            <button class="btn danger" data-action="delete-contact" data-id="${c.id}">Eliminar</button>
          </div>
        </div>
        <div class="facts">
          <div class="fact"><div class="k">Email</div><div class="v mono">${esc(c.email)}</div></div>
          <div class="fact"><div class="k">Teléfono</div><div class="v mono">${esc(c.phone || '—')}</div></div>
          <div class="fact"><div class="k">Último contacto</div><div class="v ${d >= STALE ? 'since stale' : ''}">${d === null ? 'Nunca' : `${fmt(lastContact(c.id))} · hace ${d} días`}</div></div>
          <div class="fact"><div class="k">Etiquetas</div><div class="v tags">${c.tags.map(tagHtml).join('')}</div></div>
        </div>
        <p style="margin:14px 0 0">${esc(c.notes)}</p>
      </section>
      ${enrichHtml(c)}
      <section class="panel panel-pad form" style="margin-top:16px" id="personSend">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3>Conversaciones</h3>${chatButtons(c, true)}</div>
        <div class="field"><label for="personText">Escribir mensaje</label><textarea id="personText" placeholder="Escribe aquí y elige por dónde enviarlo…"></textarea></div>
        ${sendButtons(c, '', 'Hola', true)}
      </section>
      ${futureBk.length || evs.length ? `<section class="panel panel-pad" style="margin-top:16px">
        <h3 style="margin-bottom:10px">Próximo con ${esc(c.name.split(' ')[0])}</h3>
        <div class="tags">${futureBk.map((b) => `<span class="tag cal">${esc(b.type)} · ${fmt(b.date)} ${b.start}</span>`).join('')}
        ${evs.map((e) => `<button class="tag event" style="border:0;cursor:pointer" data-action="open-event" data-id="${e.id}">${esc(e.title)} · ${e.guests.find((g) => g.cid === c.id).st}</button>`).join('')}</div>
      </section>` : ''}
      ${connectionsHtml(c)}
      <section class="panel panel-pad" style="margin-top:16px">
        <h3 style="margin-bottom:14px">Historial</h3>
        <ol class="timeline">${histRows(hist).map((i) => i.opened ? `
          <li class="opened"><span class="node"></span><div class="when">${esc(fmt(i.date))} · ${esc(i.opened.join(', '))}</div></li>` : `
          <li><span class="node ${i.ch === 'cal' ? 'cal' : i.ch === 'evento' ? 'event' : ''}"></span>
            <div class="when">${esc(fmtLong(i.date))}</div>
            <div class="tags" style="margin-top:4px">${chLabel(i)}${i.eventId ? `<span class="tag event">${esc(state.events.find((e) => e.id === i.eventId)?.title)}</span>` : ''}</div>
            <div class="what">${esc(i.text)}</div>
            ${i.follow ? `<div class="followup">Seguimiento: <span class="mono ${i.follow < iso(TODAY) ? 'since stale' : ''}">${fmt(i.follow)}</span></div>` : ''}
          </li>`).join('') || '<li class="muted">Aún no hay nada registrado.</li>'}</ol>
      </section>`;
  }

  // Buscar info pública: one web lookup per person, only on click. Suggestions change nothing until accepted.
  const ENRICH_LABEL = { role: 'Cargo', company: 'Empresa', web: 'Web', linkedin: 'LinkedIn' };
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
  const extLink = (u, text) => /^https?:\/\//i.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
  async function loadEnrich(cid) {
    state.enrich[cid] = null;
    try { state.enrich[cid] = await Api.get(`/contacts/${cid}/enrichment`); } catch { state.enrich[cid] = null; return; }
    if (state.selectedContact === cid && current() === 'contactos') render();
  }
  async function runEnrich(cid) {
    if (state.enriching) return;
    state.enriching = cid; render();
    try { state.enrich[cid] = await Api.post(`/contacts/${cid}/enrich`); }
    catch (err) { toast(err.message); }
    finally { state.enriching = null; render(); }
  }
  function enrichHtml(c) {
    if (!state.enrichOn) return '';
    if (!(c.id in state.enrich)) loadEnrich(c.id);
    const e = state.enrich[c.id];
    const busy = state.enriching === c.id;
    const btn = `<button class="btn small" data-action="enrich" data-id="${c.id}"${state.enriching ? ' disabled' : ''}>${busy ? 'Buscando…' : e ? 'Buscar de nuevo' : 'Buscar info pública'}</button>`;
    let body;
    if (busy) body = '<p class="note" style="margin:0">Buscando en la web su cargo, empresa y noticias. Puede tardar un minuto.</p>';
    else if (!e) body = `<p class="note" style="margin:0">Busca en la web el cargo, la empresa y las noticias públicas de ${esc(c.name.split(' ')[0])}. Verás de dónde sale cada dato y nada cambia en su ficha hasta que lo aceptes. Cada búsqueda cuesta unos céntimos de tu clave de Claude.</p>`;
    else {
      const sugg = e.suggestions.map((s) => `<li class="enrich-row"><span><span class="muted">${ENRICH_LABEL[s.field]}:</span> ${esc(s.value)} <span class="note">· ${extLink(s.source, hostOf(s.source))}</span></span>${s.applied ? '<span class="tag plain">Guardado</span>' : `<button class="btn small" data-action="enrich-apply" data-id="${c.id}:${s.field}">Aceptar</button>`}</li>`).join('');
      const news = e.news.map((n) => `<li>${extLink(n.url, n.title)}${n.date ? ` <span class="note mono">${esc(n.date)}</span>` : ''}${n.note ? `<div class="note">${esc(n.note)}</div>` : ''}</li>`).join('');
      const srcs = e.sources.map((x) => extLink(x.url, hostOf(x.url))).join(' · ');
      body = `
        ${e.confidence !== 'alta' ? `<p class="note" style="margin:0 0 8px"><span class="tag plain">${e.confidence === 'baja' ? 'No está claro que sea esta persona' : 'Revisa que sea esta persona'}</span></p>` : ''}
        ${e.summary ? `<p style="margin:0">${esc(e.summary)}</p>` : ''}
        ${sugg ? `<h4 class="enrich-h">Sugerencias para su ficha</h4><ul class="enrich-list">${sugg}</ul>` : ''}
        ${news ? `<h4 class="enrich-h">Noticias</h4><ul class="enrich-list">${news}</ul>` : ''}
        ${srcs ? `<p class="note" style="margin:10px 0 0">Fuentes: ${srcs}</p>` : ''}
        <p class="note" style="margin:10px 0 0">Buscado el ${fmt(e.createdAt.slice(0, 10))} · ${e.searches} búsquedas · unos ${e.costUsd.toFixed(2)} $ · <button class="linkish" data-action="enrich-delete" data-id="${c.id}">Borrar</button></p>`;
    }
    return `<section class="panel panel-pad" style="margin-top:16px" id="personEnrich">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><h3>Info pública</h3>${btn}</div>
        ${body}
      </section>`;
  }

  // Chat buttons log "Abriste el chat de X" entries; show them as one small line per day instead of full entries.
  const OPENED_RE = /^Abriste (?:el chat de (WhatsApp|Telegram)|(Gmail) para escribirle|su perfil de (LinkedIn))$/;
  function histRows(hist) {
    const out = [];
    for (const i of hist) {
      const m = !i.follow && !i.eventId && OPENED_RE.exec(i.text || '');
      if (!m) { out.push(i); continue; }
      const app = m[1] || m[2] || m[3];
      const prev = out[out.length - 1];
      if (prev?.opened && prev.date === i.date) { if (!prev.opened.includes(app)) prev.opened.push(app); }
      else out.push({ date: i.date, opened: [app] });
    }
    return out;
  }
  // ---------- Relaciones (solo con tus datos) ----------
  function metAt(cid) {
    const first = state.interactions.filter((i) => i.cid === cid).sort((a, b) => a.date.localeCompare(b.date))[0];
    if (!first) return null;
    const ev = first.eventId && state.events.find((e) => e.id === first.eventId);
    return ev ? `${ev.title} · ${fmt(first.date)}` : `${CHANNELS[first.ch]} · ${fmt(first.date)}`;
  }
  function connections(cid) {
    const out = new Map();
    const add = (id, why) => { if (id === cid) return; const cur = out.get(id) || []; cur.push(why); out.set(id, cur); };
    for (const r of state.relations) {
      if (r.a === cid) add(r.b, r.kind.startsWith('Le presentaste') ? `Le presentaste a ${byId(r.b).name.split(' ')[0]}` : r.kind);
      if (r.b === cid) add(r.a, r.kind.startsWith('Le presentaste') ? `Le presentaste a ${byId(r.b).name.split(' ')[0]}` : r.kind);
    }
    for (const e of state.events) {
      if (!e.guests.some((g) => g.cid === cid)) continue;
      for (const g of e.guests) add(g.cid, `${e.status === 'hecho' ? 'Coincidieron en' : 'Ambos invitados a'} ${e.title}`);
    }
    for (const p of state.projects) {
      if (!p.people.some((x) => x.cid === cid)) continue;
      for (const x of p.people) add(x.cid, `Proyecto ${p.title}`);
    }
    return [...out.entries()].map(([id, why]) => ({ c: byId(id), why: [...new Set(why)] })).sort((a, b) => b.why.length - a.why.length);
  }
  function connectionsHtml(c) {
    const conns = connections(c.id);
    const m = metAt(c.id);
    return `<section class="panel panel-pad" style="margin-top:16px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h3>Conexiones</h3>${m ? `<span class="muted" style="font-size:13.5px">Os conocisteis en <b style="color:var(--ink)">${esc(m)}</b></span>` : ''}</div>
      <ul class="list" style="margin-top:8px">${conns.slice(0, 6).map(({ c: o, why }) => `
        <li class="row clickable" style="padding-inline:0" data-action="open-contact" data-id="${o.id}">
          <div class="avatar">${initials(o.name)}</div>
          <div style="min-width:0"><div class="title">${esc(o.name)}</div><div class="meta">${esc(why.join(' · '))}</div></div>
          <span class="muted">›</span>
        </li>`).join('') || '<li class="muted">Aún no coincide con nadie de tu red.</li>'}</ul>
    </section>`;
  }
  // Who is likely to come to a planned event, inferred from past co-attendance only.

  // ---------- Proyectos ----------
  const TASK_ST = ['pendiente', 'enviado', 'hecho'];
  const pendingTasks = () => state.projects.flatMap((p) => p.tasks.filter((t) => t.st === 'pendiente').map((t) => ({ p, t }))).sort((a, b) => a.t.due.localeCompare(b.t.due));
  function viewProjects() {
    const p = state.projects.find((x) => x.id === state.selectedProject) || state.projects[0];
    const ev = p?.eventId && state.events.find((e) => e.id === p.eventId);
    return `
      <div class="view-head">
        <div><h1 class="sr-only">Proyectos</h1></div>
        <div class="actions">${protoFlag}<button class="btn primary" data-action="new-project">Nuevo proyecto</button></div>
      </div>
      <div class="split ${state.mobileProject ? 'has-detail' : ''}">
        <div class="list-col">
          <ul class="list panel contact-list">${state.projects.map((x) => { const n = x.tasks.filter((t) => t.st === 'pendiente').length; return `
            <li class="row clickable" data-action="open-project" data-id="${x.id}" aria-selected="${x.id === p?.id}">
              <div class="avatar" style="border-radius:8px">${initials(x.title)}</div>
              <div style="min-width:0"><div class="title">${esc(x.title)}</div><div class="meta">${x.people.length} personas · ${esc(x.desc)}</div></div>
              <span class="since ${n ? '' : 'muted'}">${n ? n + ' pend.' : 'al día'}</span>
            </li>`; }).join('')}</ul>
        </div>
        <div class="detail-col">${p ? `
          <section class="panel panel-pad">
            <button class="btn ghost small back" data-action="back-projects">← Proyectos</button>
            <div class="detail-head"><div class="who"><div class="eyebrow">${esc(p.status)}</div><h2 style="font-size:24px">${esc(p.title)}</h2></div>
              ${ev ? `<button class="tag event" style="border:0;cursor:pointer" data-action="open-event" data-id="${ev.id}">${esc(ev.title)} · ${fmt(ev.date)}</button>` : ''}</div>
            <p style="margin:10px 0 0">${esc(p.desc)}</p>
          </section>
          ${p.people.map((pp) => { const c = byId(pp.cid); const ts = p.tasks.filter((t) => t.cid === c.id); return `
          <section class="panel panel-pad" style="margin-top:12px">
            <div class="detail-head">
              <div class="avatar">${initials(c.name)}</div>
              <div class="who"><h3>${esc(c.name)}</h3><div class="muted" style="font-size:13.5px">${esc(pp.role)} · ${esc(c.company)}</div></div>
              <div class="actions"><button class="btn small" data-action="add-task" data-id="${p.id}:${c.id}">Añadir pendiente</button></div>
            </div>
            <ul class="list" style="margin-top:8px">${ts.map((t) => `
              <li class="row" style="padding-inline:0">
                <button class="tag ${t.st === 'hecho' ? '' : t.st === 'enviado' ? 'cal' : 'warn'}" style="cursor:pointer;min-width:84px;justify-content:center;${t.st === 'hecho' ? 'border:0' : ''}" data-action="task-status" data-id="${p.id}:${t.id}" title="Cambiar estado">${t.st}</button>
                <div style="min-width:0"><div class="title" style="white-space:normal;${t.st === 'hecho' ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.text)}</div></div>
                <span class="mono ${t.st === 'pendiente' && t.due < iso(TODAY) ? 'since stale' : 'muted'}">${fmt(t.due)}</span>
              </li>`).join('') || '<li class="muted" style="padding:6px 0">Nada pendiente con esta persona.</li>'}</ul>
          </section>`; }).join('')}
          <div style="margin-top:12px"><label class="eyebrow" for="addPerson">Añadir persona al proyecto</label>
            <select id="addPerson" data-project="${p.id}" class="search" style="margin-top:6px"><option value="">Elige un contacto…</option>${state.contacts.filter((c) => !p.people.some((x) => x.cid === c.id)).map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        ` : '<div class="panel empty">Crea tu primer proyecto.</div>'}</div>
      </div>`;
  }

  // ---------- Eventos ----------
  function eventCard(e) {
    const confirmed = e.guests.filter((g) => g.st !== 'invitado').length;
    return `
      <article class="panel event-card">
        <div class="top">
          <div class="datebox"><div class="d">${parse(e.date).getDate()}</div><div class="m">${MON[parse(e.date).getMonth()]}</div></div>

  function itemsOn(dateStr) {
    const out = [];
    for (const e of state.events) if (e.date === dateStr) out.push({ cls: 'event', label: `${e.start} ${e.title}`, action: 'open-event', id: e.id });
    for (const e of state.events) if (e.date === dateStr && e.status === 'planeado' && state.calConnected && state.blockEvents) out.push({ cls: 'block', label: 'Bloqueado en Cal.com', action: 'open-event', id: e.id });
    for (const b of state.bookings) if (b.date === dateStr) out.push({ cls: 'cal', label: `${b.start} ${b.type} · ${bookingName(b).split(' ')[0]}`, action: byId(b.cid) ? 'open-contact' : 'open-day', id: byId(b.cid) ? b.cid : dateStr });
    if (state.gcalConnected) for (const g of state.gcal) if (g.date === dateStr) out.push({ cls: 'gcal', label: `${g.start} ${g.title}`, action: 'gcal', id: g.id });
    for (const i of state.interactions) if (i.follow === dateStr) out.push({ cls: 'follow', label: `Seguir: ${(byId(i.cid)?.name || 'contacto').split(' ')[0]}`, action: 'open-contact', id: i.cid });
    const t = (x) => /^\d\d:\d\d/.test(x.label) ? x.label.slice(0, 5) : x.cls === 'block' ? x.label : '99';
    return out.sort((a, b) => t(a).localeCompare(t(b)));
  }
  function viewCalendar() {
    const m = state.calMonth;

    const start = addDays(first, -((first.getDay() + 6) % 7));
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = addDays(start, i);
      if (i >= 35 && d.getMonth() !== m.getMonth()) break;
      const ds = iso(d);
      cells.push(`<div class="day ${d.getMonth() !== m.getMonth() ? 'out' : ''} ${ds === iso(TODAY) ? 'today' : ''}" data-action="open-day" data-id="${ds}" role="button" tabindex="0" aria-label="Ver el ${esc(fmtLong(ds))}">

    // Agenda list for phones.
    const days = [];
    for (let d = new Date(first); d.getMonth() === m.getMonth(); d = addDays(d, 1)) {

      if (its.length) days.push(`<li class="row" style="align-items:start"><div class="datebox"><div class="d">${d.getDate()}</div><div class="m">${DOW[(d.getDay() + 6) % 7]}</div></div>

      <div class="view-head">

  // ---------- Preguntar: a chat with Claude through the local server (/ask) ----------
  const ASK_MAX_FILES = 5, ASK_MAX_BYTES = 10 * 1024 * 1024;
  const askCites = (r) => (r.cites || []).map((x) => {
    if (x.type === 'contact') { const c = byId(x.id); return c && { action: 'open-contact', id: c.id, title: c.name, badge: initials(c.name) }; }
    if (x.type === 'event') { const e = state.events.find((v) => v.id === x.id); return e && { action: 'open-event', id: e.id, title: e.title, badge: 'Ev' }; }
    if (x.type === 'project') { const p = state.projects.find((v) => v.id === x.id); return p && { action: 'open-project', id: p.id, title: p.title, badge: 'Pr' }; }
    return null;
  }).filter(Boolean);
  // Claude tags each answer with an emotion; the ö acts it out. A draft with no emotion gets a wink.
  const ASK_EMOTIONS = ['happy', 'thanks', 'eyeroll', 'wink', 'surprised', 'sad', 'celebrate', 'angry'];
  const askEmotion = (r) => (ASK_EMOTIONS.includes(r.emotion) ? r.emotion : r.draft ? 'wink' : null);
  async function claudeAsk(q) {
    let mood = null;
    const files = state.askFiles.splice(0);
    const history = state.chat.filter((m) => !m.error && m.text).slice(-20).map((m) => ({ role: m.role, text: m.text }));
    state.chat.push({ role: 'user', text: q, files: files.map((f) => ({ name: f.name, mediaType: f.mediaType, url: f.url })) });
    state.askLoading = true;
    render();
    stolkO.set('idle');
    stolkO.play('hop').then(() => { if (state.askLoading) stolkO.set('think'); });
    const body = { question: q };
    if (history.length && !state.askBasic) body.history = history;
    if (files.length) body.attachments = files.map((f) => ({ name: f.name, mediaType: f.mediaType, data: f.data }));
    try {
      let r;
      try { r = await Api.post('/ask', body); }
      catch (err) {
        // Older server without history support: ask again with just the question (files still need the newer server).
        if (!/unknown field: history/i.test(err.message)) throw err;
        state.askBasic = true; delete body.history; r = await Api.post('/ask', body);
      }
      state.chat.push({ role: 'assistant', text: r.answer || '', cites: askCites(r), draft: r.draft || null });
      mood = askEmotion(r);
    } catch (err) {
      const msg = /unknown field: attachments/i.test(err.message) ? 'Tu servidor de Stölk aún no acepta archivos. Actualiza Stölk y vuelve a probar.' : err.message;
      state.chat.push({ role: 'assistant', error: msg });
      mood = err.body?.emotion === 'angry' || err.body?.error?.emotion === 'angry' ? 'angry' : 'error';
    }
    state.askLoading = false;
    render();
    stolkO.set('idle');
    if (mood) stolkO.play(mood);
  }
  function readAskFile(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => { const url = String(fr.result); resolve({ name: file.name, mediaType: file.type || 'application/octet-stream', size: file.size, url, data: url.slice(url.indexOf(',') + 1) }); };
      fr.onerror = () => reject(fr.error);
      fr.readAsDataURL(file);
    });
  }
  async function addAskFiles(list) {
    for (const file of list) {
      const total = state.askFiles.reduce((n, f) => n + f.size, 0) + file.size;
      if (state.askFiles.length >= ASK_MAX_FILES) { toast(`Máximo ${ASK_MAX_FILES} archivos por mensaje`); break; }
      if (total > ASK_MAX_BYTES) { toast('Los archivos pasan de 10 MB'); break; }
      if (!/^(image\/(png|jpeg|webp|gif)|application\/pdf|text\/)/.test(file.type)) { toast(`${file.name}: solo imágenes, PDF o texto`); continue; }
      state.askFiles.push(await readAskFile(file));
    }
    renderComposerFiles();
  }
  const fileChip = (f, i, removable) => `<span class="file-chip">${/^image\//.test(f.mediaType) && f.url ? `<img src="${f.url}" alt="">` : '<span class="file-ico" aria-hidden="true">▤</span>'}<span class="file-name">${esc(f.name)}</span>${removable ? `<button type="button" class="file-x" data-remove-file="${i}" aria-label="Quitar ${esc(f.name)}">×</button>` : ''}</span>`;
  function renderComposerFiles() {
    const el = document.getElementById('askFiles');
    if (el) el.innerHTML = state.askFiles.map((f, i) => fileChip(f, i, true)).join('');
  }
  function viewAsk() {
    const lastDraft = state.chat.map((m) => !!m.draft).lastIndexOf(true);
    const msgs = state.chat.map((m, idx) => {
      if (m.role === 'user') return `<div class="msg me"><div class="bubble">${m.files?.length ? `<div class="msg-files">${m.files.map((f, i) => fileChip(f, i, false)).join('')}</div>` : ''}<div class="msg-text">${esc(m.text)}</div></div></div>`;

        </div></div>`;
    }).join('');
    return `
      <div class="chat">
        <div class="chat-head"><h1 class="sr-only">Preguntar</h1>${state.chat.length ? '<button class="btn ghost small" data-action="chat-new">Nueva conversación</button>' : ''}</div>

          <div class="composer-files" id="askFiles">${state.askFiles.map((f, i) => fileChip(f, i, true)).join('')}</div>
          <div class="composer-row">
            <button type="button" class="icon-btn" id="askAttach" aria-label="Adjuntar fotos o documentos" title="Adjuntar fotos o documentos">+</button>
            <input type="file" id="askFileInput" multiple accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,text/*" hidden>
            <textarea id="askInput" rows="1" placeholder="Escribe a Claude…" aria-label="Tu mensaje para Claude"></textarea>
            <button class="btn primary send" type="submit" aria-label="Enviar"${state.askLoading ? ' disabled' : ''}>Enviar</button>
          </div>
        </form>
      </div>`;
  }

  // ---------- Capture review (global shortcut) ----------
  const CARD_FIELDS = [['name', 'Nombre'], ['role', 'Cargo'], ['company', 'Empresa'], ['email', 'Email'], ['phone', 'Teléfono'], ['linkedin', 'LinkedIn'], ['web', 'Web']];
  async function onCapture(r) {
    state.capture = { ...(state.capture || {}), ...r };
    stolkO.set(r.status === 'reading' ? 'think' : 'idle');
    if (r.status === 'ok') stolkO.play(r.card?.found === false ? 'sad' : 'happy');
    if (r.status === 'error') stolkO.play('error');
    if (r.status === 'ok') {
      const q = new URLSearchParams(Object.entries({ email: r.card.email, phone: r.card.phone, name: r.card.name }).filter(([, v]) => v)).toString();
      try { state.capture.matches = q ? await Api.get(`/contacts/match?${q}`) : []; } catch { state.capture.matches = []; }

  function modalCapture() {
    const cap = state.capture;

    if (cap.status === 'reading') return openModal(`<h2>Leyendo tu captura…</h2>${img}<p class="note" style="margin:0">Se ha enviado a Claude solo este recorte.</p><div class="modal-foot"><button type="button" class="btn ghost" data-action="close-capture">Cancelar</button></div>`, () => {});

    const best = (cap.matches || [])[0];
    openModal(`

        ${CARD_FIELDS.map(([k, label]) => `<div class="field"><label for="cap-${k}">${label}</label><input id="cap-${k}" name="${k}" value="${esc(c[k] || (k === 'web' ? c.website : '') || '')}"${k === 'name' ? ' required' : ''}></div>`).join('')}

      <div class="modal-foot"><button type="button" class="btn ghost" data-action="close-capture">Descartar</button><button class="btn primary" type="submit">Guardar</button></div>`,
    (fd) => saveCapture(fd));
  }
  function saveCapture(fd) {
    const card = Object.fromEntries(CARD_FIELDS.map(([k]) => [k, String(fd.get(k) || '').trim()]));
    const notes = String(fd.get('notes') || '').trim();
    const mergeId = Number(fd.get('merge')) || null;
    act(async () => {
      let id = mergeId;
      if (mergeId) {
        const old = byId(mergeId) || {};
        const patch = Object.fromEntries(Object.entries(card).filter(([k, v]) => v && !old[k]));
        if (notes) patch.notes = [old.notes, notes].filter(Boolean).join('\n');
        if (Object.keys(patch).length) await Api.patch(`/contacts/${mergeId}`, patch);
      } else {
        const made = await Api.post('/contacts', { ...card, tags: [], notes });
        id = made.id;
      }
      await Api.post('/interactions', { cid: id, date: iso(TODAY), ch: 'mensaje', text: 'Guardado desde una captura de pantalla.' });
      state.capture = null; state.selectedContact = id; state.mobileDetail = true;
      closeModal(); location.hash = '#contactos';
    }, ['contacts', 'interactions'], mergeId ? 'Ficha actualizada' : 'Persona guardada');

  function slotsFor(dateStr) {
    const taken = state.bookings.filter((b) => b.date === dateStr).map((b) => b.start);
    const blocked = state.events.filter((e) => e.date === dateStr && e.status === 'planeado');
    return ['09:00', '09:30', '10:00', '10:30', '11:00', '12:00', '16:00', '16:30', '17:00', '18:00', '19:30']

  // People picker: type to filter, click or Enter to add, × to remove. Hidden inputs keep FormData.getAll(name) working.
  const peoplePicker = (id, name, placeholder) => `
    <div class="picker" data-picker="${id}" data-name="${name}">
      <div class="picker-chips" id="${id}Chips"></div>
      <input id="${id}" type="search" autocomplete="off" placeholder="${esc(placeholder)}" role="combobox" aria-expanded="false" aria-controls="${id}List" aria-autocomplete="list">
      <ul class="picker-list" id="${id}List" role="listbox" hidden></ul>
    </div>`;
  function wirePicker(id) {
    const root = modalRoot.querySelector(`[data-picker="${id}"]`);
    const name = root.dataset.name;
    const input = document.getElementById(id), list = document.getElementById(`${id}List`), chips = document.getElementById(`${id}Chips`);
    const chosen = [];
    let active = 0, matches = [];
    const norm = (t) => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const drawChips = () => {
      chips.innerHTML = chosen.map((cid) => { const c = byId(cid); return c ? `<span class="pick-chip"><span class="avatar">${initials(c.name)}</span>${esc(c.name)}<button type="button" data-remove="${cid}" aria-label="Quitar a ${esc(c.name)}">×</button><input type="hidden" name="${name}" value="${cid}"></span>` : ''; }).join('');
    };
    const drawList = () => {
      const q = norm(input.value.trim());
      matches = state.contacts.filter((c) => !chosen.includes(c.id) && (!q || norm(`${c.name} ${c.company || ''} ${c.role || ''} ${c.email || ''}`).includes(q))).slice(0, 8);
      active = Math.min(active, Math.max(matches.length - 1, 0));
      list.innerHTML = matches.length ? matches.map((c, i) => `<li role="option" data-cid="${c.id}" aria-selected="${i === active}"><span class="avatar">${initials(c.name)}</span><span>${esc(c.name)}${c.company ? ` <span class="muted">· ${esc(c.company)}</span>` : ''}</span></li>`).join('') : `<li class="none">${state.contacts.length ? 'Nadie con ese nombre' : 'Aún no tienes personas'}</li>`;
      list.hidden = false; input.setAttribute('aria-expanded', 'true');
    };
    const hide = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); };
    const add = (cid) => { if (!chosen.includes(cid)) chosen.push(cid); input.value = ''; active = 0; drawChips(); drawList(); input.focus(); };
    input.addEventListener('focus', drawList);
    input.addEventListener('input', () => { active = 0; drawList(); });
    input.addEventListener('blur', () => setTimeout(hide, 120));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (list.hidden) drawList(); active = (active + (e.key === 'ArrowDown' ? 1 : -1) + matches.length) % Math.max(matches.length, 1); drawList(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (matches[active]) add(matches[active].id); }
      else if (e.key === 'Escape' && !list.hidden) { e.stopPropagation(); hide(); }
      else if (e.key === 'Backspace' && !input.value && chosen.length) { chosen.pop(); drawChips(); drawList(); }
    });
    list.addEventListener('mousedown', (e) => { const li = e.target.closest('li[data-cid]'); if (li) { e.preventDefault(); add(Number(li.dataset.cid)); } });
    chips.addEventListener('click', (e) => { const b = e.target.closest('[data-remove]'); if (b) { chosen.splice(chosen.indexOf(Number(b.dataset.remove)), 1); drawChips(); input.focus(); } });
  }
  // Click a day in Calendario: everything on that day, untruncated, with what you can do next.

      const c = byId(b.cid);
      out.push({ start: b.start, end: b.end, title: c ? `${b.type} con ${c.name}` : b.type, meta: c ? [c.role, c.company].filter(Boolean).join(' · ') : [b.attendeeName, b.attendeeEmail].filter(Boolean).join(' · '), tag: '<span class="tag cal">Cal.com</span>',

    }

    for (const i of state.interactions) if (i.follow === ds) { const c = byId(i.cid); out.push({ start: '', end: '', title: `Seguir con ${c?.name || 'contacto'}`, meta: i.text || '', tag: '<span class="tag plain">Seguimiento</span>', btn: c ? `<button class="btn small" data-action="open-contact" data-id="${c.id}">Ver persona</button>` : '' }); }

  // One-click drafts per channel (see research/envio-enlace-cal.md). Nothing is sent without Ivan's click.
  function chatButtons(c, small) {
    const digits = (c.phone || '').replace(/\D/g, '');
    const enc = encodeURIComponent;
    const k = small ? 'btn small' : 'btn';
    const b = [];
    if (digits) b.push(`<a class="${k}" href="${waLink(digits)}" target="_blank" rel="noopener">WhatsApp</a>`);
    if (digits) b.push(`<a class="${k}" href="https://t.me/+${digits}" target="_blank" rel="noopener">Telegram</a>`);
    if (c.email) b.push(`<a class="${k}" href="https://mail.google.com/mail/u/0/#search/${enc(`from:${c.email} OR to:${c.email}`)}" target="_blank" rel="noopener">Gmail</a>`);
    if (c.linkedin) b.push(`<a class="${k}" href="https://www.${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
    return `<div class="chat-btns">${b.join('')}</div>`;
  }
  // WhatsApp: on Linux there is no desktop app, so default to WhatsApp Web (skips the "open the app" landing).
  const waModeDefault = () => /Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent) ? 'web' : 'app';
  const waMode = () => { try { return localStorage.getItem('stolk-wa') || waModeDefault(); } catch { return waModeDefault(); } };
  const waLink = (digits, text) => waMode() === 'web'
    ? `https://web.whatsapp.com/send?phone=${digits}${text !== undefined ? `&text=${encodeURIComponent(text)}` : ''}`
    : `https://wa.me/${digits}${text !== undefined ? `?text=${encodeURIComponent(text)}` : ''}`;
  function sendButtons(c, text, subject, withEdit) {
    const digits = (c.phone || '').replace(/\D/g, '');
    const enc = encodeURIComponent;
    const b = [];
    if (digits) b.push(`<a class="btn primary" href="${waLink(digits, text)}" target="_blank" rel="noopener" data-sent="WhatsApp">WhatsApp</a>`);
    if (digits) b.push(`<a class="btn" href="https://t.me/+${digits}?text=${enc(text)}" target="_blank" rel="noopener" data-sent="Telegram">Telegram</a>`);
    if (c.email) b.push(`<a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=${enc(c.email)}&su=${enc(subject)}&body=${enc(text)}" target="_blank" rel="noopener" data-sent="Gmail">Gmail</a>`);
    if (c.linkedin) b.push(`<a class="btn" href="https://www.${esc(c.linkedin)}" target="_blank" rel="noopener" data-sent="LinkedIn" data-copy-first>LinkedIn (copia y abre perfil)</a>`);
    b.push('<button type="button" class="btn" data-copy-text>Copiar</button>');
    if (withEdit) b.push('<button type="button" class="btn" data-edit-text>Editar con Claude</button><button type="button" class="btn ghost" data-undo-edit hidden>Deshacer</button>');
    return `<div class="actions">${b.join('')}</div><p class="note" style="margin:0">Se abre la app con el mensaje escrito. Tú pulsas Enviar.</p>`;
  }
  // Claude rewrites the typed message in place (or drafts one if the box is empty). Nothing is sent.
  async function editWithClaude(btn, c, ta) {
    const before = ta.value.trim();
    const first = c.name.split(' ')[0];
    const question = before
      ? `Mejora este mensaje para ${c.name} (id ${c.id}): corrige faltas y que suene natural, en mi tono, sin cambiar lo que quiero decir ni alargarlo. Mensaje: «${before}»`
      : `Escribe un mensaje corto para ${c.name} (id ${c.id}) retomando el contacto según nuestro historial.`;
    btn.disabled = true; btn.textContent = 'Editando…'; ta.readOnly = true;
    try {
      const r = await Api.post('/ask', { question });
      const text = r.draft?.cid === c.id ? r.draft.text : '';
      if (!text) { toast(r.answer || `Claude no ha devuelto un mensaje para ${first}`); return; }
      ta.dataset.before = ta.value;
      ta.value = text;
      const undo = btn.parentElement.querySelector('[data-undo-edit]');
      if (undo) undo.hidden = false;
      ta.focus();
    } catch (err) { toast(err.message); }
    finally { btn.disabled = false; btn.textContent = 'Editar con Claude'; ta.readOnly = false; }
  }
  async function handleSendClick(e, c, getText) {
    if (e.target.closest('[data-copy-text]') || e.target.closest('[data-copy-first]')) {
      try { await navigator.clipboard.writeText(getText()); toast('Mensaje copiado'); } catch { toast('Selecciona y copia el texto'); }
    }
    const sent = e.target.closest('[data-sent]');
    if (sent && c) {
      act(() => Api.post(`/contacts/${c.id}/opened`, { channel: sent.dataset.sent.toLowerCase() }), ['interactions', 'contacts'],
        `Anotado en el historial de ${c.name.split(' ')[0]}`);
    }
  }

  // ---------- Events ----------
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const id = el.dataset.id;
    if (a === 'close-modal') { if (e.target === el) closeModal(); return; }
    if (a === 'open-contact' || a === 'select-contact') {
      state.selectedContact = Number(id); state.mobileDetail = true; closeModal();
      if (current() !== 'contactos') location.hash = '#contactos'; else render();
    } else if (a === 'back-list') { state.mobileDetail = false; render(); }
    else if (a === 'filter') { state.contactFilter = id; render(); }
    else if (a === 'open-event') modalEventDetail(Number(id));
    else if (a === 'log') modalLog(id ? Number(id) : state.selectedContact);
    else if (a === 'edit-contact') modalContact(byId(Number(id)));
    else if (a === 'delete-contact') modalDeleteContact(byId(Number(id)));
    else if (a === 'new-event') modalEvent(/^\d{4}-\d\d-\d\d$/.test(id || '') ? id : undefined);
    else if (a === 'open-day') modalDay(id);
    else if (a === 'save-attendee') { const b = state.bookings.find((x) => x.id === Number(id)); if (b) modalContact(null, { name: b.attendeeName || '', email: b.attendeeEmail || '' }); }
    else if (a === 'meet') modalMeet(id ? Number(id) : null);
    else if (a === 'mcp-on') act(() => Api.post(`/integrations/claude/${id}`), ['claudeMcp'], id === 'desktop' ? 'Conectado. Reinicia Claude para verlo.' : 'Conectado a Claude Code');
    else if (a === 'mcp-off') act(() => Api.del(`/integrations/claude/${id}`), ['claudeMcp'], 'Desconectado');
    else if (a === 'claude-on') act(() => Api.patch('/settings', { claudeOn: true }), ['settings'], 'Claude activado');
    else if (a === 'enrich-on') act(() => Api.patch('/settings', { enrichOn: true }), ['settings'], 'Buscar info pública activado');
    else if (a === 'enrich-off') act(() => Api.patch('/settings', { enrichOn: false }), ['settings'], 'Buscar info pública desactivado');
    else if (a === 'enrich') runEnrich(Number(id));
    else if (a === 'enrich-apply') { const [cid, field] = id.split(':'); act(async () => { const r = await Api.post(`/contacts/${cid}/enrichment/apply`, { fields: [field] }); state.enrich[cid] = r.enrichment; }, ['contacts'], `${ENRICH_LABEL[field]} guardado en su ficha`); }
    else if (a === 'enrich-delete') act(async () => { await Api.del(`/contacts/${id}/enrichment`); state.enrich[id] = null; }, [], 'Búsqueda borrada');
    else if (a === 'claude-off') act(() => Api.patch('/settings', { claudeOn: false }), ['settings'], 'Claude apagado');
    else if (a === 'save-key') { const inp = document.getElementById(`key-${id}`); const key = inp.value.trim(); if (!key) { toast('Pega la clave primero'); return; } act(async () => { await Api.put(`/connections/${id}`, { apiKey: key }); inp.value = ''; }, ['connections', 'shell'], 'Clave guardada en tu ordenador'); }
    else if (a === 'capture') { if (window.stolk?.capture) window.stolk.capture(); else toast('La captura solo funciona en la app de escritorio'); }
    else if (a === 'panel') act(() => window.stolk.setPanel(id === 'on'), ['shell']);
    else if (a === 'save-shortcut') { const v = document.getElementById('shortcutInput').value.trim(); act(async () => { const r = await window.stolk.setSettings({ shortcut: v }); if (!r.ok) throw new Error(r.message); if (!r.shortcutActive) throw new Error('El sistema no deja usar este atajo; prueba otro.'); }, ['shell'], `Atajo guardado: ${v}`); }
    else if (a === 'save-capture') saveCapture();
    else if (a === 'close-capture') { state.capture = null; closeModal(); }
    else if (a === 'open-project') { state.selectedProject = Number(id); state.mobileProject = true; if (current() !== 'proyectos') location.hash = '#proyectos'; else render(); }
    else if (a === 'back-projects') { state.mobileProject = false; render(); }
    else if (a === 'new-project') modalNewProject();
    else if (a === 'add-task') { const [p, c] = id.split(':').map(Number); modalAddTask(p, c); }
    else if (a === 'task-status') {
      const [pid, tid] = id.split(':').map(Number);
      const t = state.projects.find((p) => p.id === pid).tasks.find((x) => x.id === tid);
      const st = TASK_ST[(TASK_ST.indexOf(t.st) + 1) % TASK_ST.length];
      act(() => Api.patch(`/tasks/${tid}`, { st }), ['projects'], `Marcado como ${st}`);
    }
    else if (a === 'invite') {
      const [eid, cid] = id.split(':').map(Number);
      act(() => Api.put(`/events/${eid}/guests/${cid}`, { st: 'invitado' }), ['events'], `${byId(cid).name.split(' ')[0]} invitado`).then((ok) => ok && modalEventDetail(eid));
    }
    else if (a === 'new-contact') modalContact(null);
    else if (a === 'month') { const n = Number(id); state.calMonth = n === 0 ? new Date(TODAY.getFullYear(), TODAY.getMonth(), 1) : new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + n, 1); act(() => {}, ['calendar']); }
    else if (a === 'gcal') { const g = state.gcal.find((x) => x.id === id); toast(`${g.title} · ${g.start}–${g.end}${g.place ? ' · ' + g.place : ''} (Google Calendar)`); }
    else if (a === 'chat-new') { state.chat = []; state.askFiles = []; render(); }
    else if (a === 'theme') { window.stolkTheme.set(id); render(); }
    else if (a === 'gcal-on') {
      const clientId = document.getElementById('g-client-id')?.value.trim(), clientSecret = document.getElementById('g-client-secret')?.value.trim();

        setTimeout(() => { const d = document.querySelector('details'); if (d) { d.open = true; d.scrollIntoView({ block: 'center' }); } document.getElementById('g-client-id')?.focus(); }, 150);
        toast('Esta versión aún no trae el acceso de Google. Pega tu Client ID y Client secret una vez.');
        return;
      }
      act(async () => {
        const { authUrl } = await Api.post('/connections/gcal/start', clientId || clientSecret ? { clientId, clientSecret } : {});
        openExternal(authUrl);
        state.gcalStarting = true;
        // Poll until the browser round-trip lands (focus also refreshes); stop after 3 minutes.
        const until = Date.now() + 180000;
        const poll = setInterval(async () => {
          try { await load('connections'); } catch {}
          if (state.gcalConnected || Date.now() > until) { clearInterval(poll); state.gcalStarting = false; if (state.gcalConnected) { toast('Google conectado'); syncNow(false); } render(); }
        }, 2000);
      }, [], 'Elige tu cuenta de Google en el navegador');
    }
    else if (a === 'gcal-off') act(() => Api.del('/connections/gcal'), ['connections', 'calendar', 'today'], 'Google Calendar desconectado');
    else if (a === 'sync') syncNow(true);
    else if (a === 'disconnect') act(() => Api.del('/connections/calcom'), ['connections'], 'Cal.com desconectado');
    else if (a === 'copy') {
      try { await navigator.clipboard.writeText('https://' + id); toast('Enlace copiado'); }
      catch { toast('https://' + id); }
    }
  });
